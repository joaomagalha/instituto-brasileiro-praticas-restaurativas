<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<!-- Painel nunca dentro de quadro de outro site (19/10/2026, revisão de segurança):
     o GitHub Pages não deixa mandar X-Frame-Options, então a trava é aqui.
     A página nasce escondida e só aparece se estiver aberta sozinha. -->
<style id="anti-quadro">html{display:none!important}</style>
<script>
  if (window.self === window.top) {
    document.getElementById('anti-quadro').remove();
  } else {
    try { window.top.location = window.self.location.href; } catch (e) { /* quadro bloqueado: continua escondida */ }
  }
</script>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>Nova senha | Painel IBPR</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" rel="stylesheet"/>
<link href="../assets/css/tokens.css?v=20260916a" rel="stylesheet"/>
<link href="../assets/css/components.css?v=20260916q" rel="stylesheet"/>
<link href="assets/painel.css?v=20261006a" rel="stylesheet"/>
<link href="../assets/images/ibpr-logo-icone.png" rel="icon" type="image/png"/>
</head>
<body class="painel">

<!-- Destino do link que o Supabase manda por e-mail. O endereço chega com
     um token na parte final da URL; o supabase-js reconhece sozinho e abre
     uma sessão temporária que só serve pra trocar a senha. -->
<main class="painel-login">
  <div class="painel-card">

    <img alt="IBPR" class="painel-login__marca" src="../assets/images/ibpr-logo-full-navy.png"/>
    <h1>Criar nova senha</h1>
    <p class="painel-login__sub" id="subtitulo">Confirmando o link&hellip;</p>

    <div class="painel-msg" id="msg" hidden></div>

    <form hidden id="formNovaSenha" novalidate>
      <div class="campo">
        <label for="senha1">Nova senha</label>
        <input autocomplete="new-password" id="senha1" minlength="8" required type="password"/>
        <span class="campo__dica">Mínimo de 8 caracteres, com letras e números. Use algo que só você saiba.</span>
      </div>

      <div class="campo">
        <label for="senha2">Repita a nova senha</label>
        <input autocomplete="new-password" id="senha2" minlength="8" required type="password"/>
      </div>

      <button class="btn btn--dark btn--bloco" id="btnSalvarSenha" type="submit">
        Salvar e entrar <i aria-hidden="true" class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <p class="painel-login__link" hidden id="voltar">
      <a href="index.html">Voltar para o login</a>
    </p>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="../assets/js/supabase-config.js?v=20260909m"></script>
<script src="../assets/js/supabase-client.js?v=20260918a"></script>
<script src="assets/painel.js?v=20261019a"></script>
<script>
  IBPR.painel.iniciarNovaSenha();
</script>

</body>
</html>
