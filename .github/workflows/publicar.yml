# =====================================================================
# IBPR — publica o site a partir do CMS
# =====================================================================
# Roda build/gerar.mjs, que lê o conteúdo publicado no Supabase e escreve
# o HTML. Se algo mudou, commita em `main`. Depois gera a versão otimizada
# (build/otimizar/otimizar.cjs → _site) e publica ela no GitHub Pages.
#
# Desde 20/10/2026 o Pages publica pelo Actions (modo "GitHub Actions"), não
# mais direto de main/raiz: o repo guarda o HTML legível, que o robô
# reescreve, e o que vai pro ar é o _site otimizado (CSS de cada página num
# arquivo só, sem regra sobrando, fontes servidas pelo site, JS minificado).
#
# Sobre o gatilho `push` (proibido até 20/10/2026, por medo de loop): o commit
# que este workflow faz usa o GITHUB_TOKEN, e push feito com ele não dispara
# workflow nenhum, então não há loop. Mesmo assim o job pula push de commit
# do robô (mensagem "CMS: ..."), por garantia. O push manual precisa disparar
# porque agora é este workflow que põe o site no ar.

name: Publicar site

on:
  # 1. Chamado pelo Supabase quando alguém publica algo no painel
  repository_dispatch:
    types: [cms]

  # 2. Rede de segurança: se um aviso do Supabase se perder (ou a rodada
  #    dele falhar), o site se corrige sozinho em cerca de 1 hora (o GitHub
  #    costuma atrasar o agendamento em até ~40 min). Era de 6 em 6 h até
  #    22/10/2026; repo público, o Actions não cobra.
  schedule:
    - cron: '17 * * * *'

  # 3. Botão manual na aba Actions
  workflow_dispatch:
    inputs:
      permitir_queda:
        description: 'Deixar sair do ar muitas notícias ou artigos de uma vez (só se o Instituto apagou de propósito)'
        type: boolean
        default: false

  # 4. Mudança feita à mão no main (código, CSS, imagem)
  push:
    branches: [main]

# Só uma execução por vez. Duas publicações seguidas não podem gerar dois
# builds concorrentes commitando por cima um do outro.
concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'CMS:')
    runs-on: ubuntu-latest
    # Um build normal leva menos de 1 minuto. Sem limite, uma consulta
    # travada seguraria a fila de publicações por até 6 horas. 15 min (era
    # 10 até 22/10/2026): o gerar.mjs tenta cada consulta 3 vezes (até ~2
    # min com o banco fora do ar, medido), e o passo de commit pode rodar o
    # gerar.mjs de novo até 3 vezes se o push for rejeitado; com folga, quem
    # encerra é o próprio script, com a mensagem do Supabase no log.
    timeout-minutes: 15
    permissions:
      contents: write   # o GITHUB_TOKEN nativo já basta pra commitar
      pages: write      # publicar no Pages
      id-token: write   # exigido pelo deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.implantar.outputs.page_url }}

    steps:
      # ref: main (28/09/2026). Sem isso, uma execução que ficou na fila
      # montava o site sobre a versão do main de quando foi DISPARADA, não
      # a de agora.
      # Fixadas pelo código do commit, não pela etiqueta (19/10/2026, revisão de
      # segurança): etiqueta pode ser movida por quem controla a action.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Sem `npm install`: o gerador é Node puro, sem dependências.
      - name: Gerar HTML a partir do CMS
        run: node build/gerar.mjs
        env:
          IBPR_PERMITIR_QUEDA: ${{ inputs.permitir_queda && '1' || '' }}

      - name: Commitar se algo mudou
        env:
          IBPR_PERMITIR_QUEDA: ${{ inputs.permitir_queda && '1' || '' }}
        run: |
          git config user.name  "IBPR CMS"
          git config user.email "actions@github.com"
          # Se alguém deu push no main entre o checkout e agora (aconteceu
          # em 15/09/2026: "rejected, fetch first"), pega o main novo e GERA
          # DE NOVO em cima dele, até 3 vezes. O build é determinístico, então
          # gerar de novo é mais seguro que mesclar: até 28/09/2026 era um
          # rebase -X theirs, que falhava em "editado de um lado, apagado do
          # outro" e podia descartar uma edição manual perto de um marcador.
          for tentativa in 1 2 3; do
            git add -A
            if git diff --staged --quiet; then
              echo "Nada mudou. Nenhum commit."
              exit 0
            fi
            git commit -q -m "CMS: atualiza o site com o conteúdo publicado

          Commit automático de build/gerar.mjs. Não editar à mão os
          arquivos gerados: o próximo build sobrescreve."
            if git push; then exit 0; fi
            echo "Push rejeitado (tentativa $tentativa): pegando o main novo e gerando de novo."
            git fetch origin main
            git reset --hard origin/main
            node build/gerar.mjs
          done
          echo "Não consegui publicar depois de 3 tentativas."
          exit 1

      # Versões travadas no package-lock.json desta pasta.
      - name: Instalar as ferramentas do otimizar
        run: npm ci --prefix build/otimizar --no-audit --no-fund

      - name: Gerar a versão otimizada (_site)
        run: node build/otimizar/otimizar.cjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: implantar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
