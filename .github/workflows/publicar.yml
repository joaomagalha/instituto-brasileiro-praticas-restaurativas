# =====================================================================
# IBPR — publica o site a partir do CMS
# =====================================================================
# Roda build/gerar.mjs, que lê o conteúdo publicado no Supabase e escreve
# o HTML. Se algo mudou, commita em `main`; o GitHub Pages republica
# sozinho (o Pages deste repo publica de main/raiz, modo clássico).
#
# ⚠️ NÃO ACRESCENTE `push` NOS GATILHOS.
# Este workflow commita em main. Se ele também disparasse em push, cada
# execução dispararia a próxima, para sempre.

name: Publicar site

on:
  # 1. Chamado pelo Supabase quando alguém publica algo no painel
  repository_dispatch:
    types: [cms]

  # 2. Rede de segurança: se um aviso do Supabase se perder, o site se
  #    corrige sozinho em no máximo 6 horas.
  schedule:
    - cron: '17 */6 * * *'

  # 3. Botão manual na aba Actions
  workflow_dispatch:
    inputs:
      permitir_queda:
        description: 'Deixar sair do ar muitas notícias ou artigos de uma vez (só se o Instituto apagou de propósito)'
        type: boolean
        default: false

# Só uma execução por vez. Duas publicações seguidas não podem gerar dois
# builds concorrentes commitando por cima um do outro.
concurrency:
  group: publicar-site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Um build normal leva menos de 1 minuto. Sem limite, uma consulta
    # travada seguraria a fila de publicações por até 6 horas.
    timeout-minutes: 10
    permissions:
      contents: write   # o GITHUB_TOKEN nativo já basta pra commitar

    steps:
      # ref: main (28/09/2026). Sem isso, uma execução que ficou na fila
      # montava o site sobre a versão do main de quando foi DISPARADA, não
      # a de agora.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sem `npm install`: o gerador é Node puro, sem dependências.
      - name: Gerar HTML a partir do CMS
        run: node build/gerar.mjs
        env:
          IBPR_PERMITIR_QUEDA: ${{ inputs.permitir_queda && '1' || '' }}

      - name: Commitar se algo mudou
        env:
          IBPR_PERMITIR_QUEDA: ${{ inputs.permitir_queda && '1' || '' }}
        run: |
          git config user.name  "IBPR CMS"
          git config user.email "actions@github.com"
          # Se alguém deu push no main entre o checkout e agora (aconteceu
          # em 15/09/2026: "rejected, fetch first"), pega o main novo e GERA
          # DE NOVO em cima dele, até 3 vezes. O build é determinístico, então
          # gerar de novo é mais seguro que mesclar: até 28/09/2026 era um
          # rebase -X theirs, que falhava em "editado de um lado, apagado do
          # outro" e podia descartar uma edição manual perto de um marcador.
          for tentativa in 1 2 3; do
            git add -A
            if git diff --staged --quiet; then
              echo "Nada mudou. Nenhum commit."
              exit 0
            fi
            git commit -q -m "CMS: atualiza o site com o conteúdo publicado

          Commit automático de build/gerar.mjs. Não editar à mão os
          arquivos gerados: o próximo build sobrescreve."
            if git push; then exit 0; fi
            echo "Push rejeitado (tentativa $tentativa): pegando o main novo e gerando de novo."
            git fetch origin main
            git reset --hard origin/main
            node build/gerar.mjs
          done
          echo "Não consegui publicar depois de 3 tentativas."
          exit 1
