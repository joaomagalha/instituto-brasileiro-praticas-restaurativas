<!-- Página que o GitHub Pages serve quando o endereço não existe.
     Sem navbar de propósito: o menu é montado pelo CMS a cada publicação, e
     acoplar esta página ao build só pra ter menu criaria uma dependência que
     não paga o que custa. Uma saída clara pra Home resolve.
     14/10/2026: caminhos todos absolutos (/assets/...), porque o GitHub Pages
     serve esta página em qualquer endereço, inclusive com pasta (/a/b), e aí o
     relativo quebrava o CSS.
     20/10/2026: visual novo. Fundo claro granulado, logo no topo e o cartão
     pintado das chamadas finais, com a trilha na floresta (pintura própria,
     cta-404; "um caminho" pra quem se perdeu). Textos e links iguais. -->
<style>
  body { margin: 0; background: url("/assets/images/grao.png"), radial-gradient(40vw 30vw at 100% 0%, rgba(15, 107, 109, 0.12), transparent 72%), radial-gradient(40vw 30vw at 0% 100%, rgba(217, 183, 79, 0.1), transparent 72%), #FAFBF8; font-family: "Instrument Sans", system-ui, sans-serif; }
  .erro { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; gap: clamp(2.4rem, 3vw, 3.6rem); padding: clamp(2.4rem, 3vw, 4rem) clamp(1.6rem, 3vw, 4rem); box-sizing: border-box; }
  .erro__marca { display: inline-block; }
  .erro__logo { display: block; height: 5.2rem; width: auto; }
  .erro .citacao-cartao { width: 100%; max-width: 144rem; flex: 1; min-height: clamp(48rem, 70vh, 68rem); box-sizing: border-box; }
  .citacao-cartao--cta-404 { --cit-img: url("/assets/images/cta-404-1920.webp"); background-position: center 60%; }
  @media (max-width: 1279px) { .citacao-cartao--cta-404 { --cit-img: url("/assets/images/cta-404-1100.webp"); } }
  @media (max-width: 640px) { .citacao-cartao--cta-404 { --cit-img: url("/assets/images/cta-404-cel.webp"); background-position: center; } }
  .erro__num { margin: 0 0 1.2rem; color: #fff; font: 500 clamp(8rem, 11vw, 14rem)/0.9 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: -0.05em; text-shadow: 0 2px 30px rgba(6, 26, 48, 0.35); }
  .erro .cta-final__title { font-family: "Plus Jakarta Sans", system-ui, sans-serif; font-weight: 500; letter-spacing: -0.03em; }
  .erro__links { display: flex; flex-wrap: wrap; gap: 1.2rem 1.6rem; justify-content: center; }
  .erro__btn-vidro { display: inline-flex; align-items: center; gap: 1rem; padding: 1.5rem 2.6rem; border-radius: 1.2rem; color: #fff; font: 600 1.5rem/1 "Instrument Sans", system-ui, sans-serif; text-decoration: none; background: rgba(255, 255, 255, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); transition: background-color 0.3s ease; }
  .erro__btn-vidro:hover { background: rgba(255, 255, 255, 0.22); }
  .erro__btn-vidro:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .erro__mais { margin: 2.8rem 0 0; color: rgba(255, 255, 255, 0.86); font-size: 1.5rem; text-shadow: 0 1px 12px rgba(6, 26, 48, 0.45); }
  .erro__mais a { display: inline-block; padding: 1rem 0.4rem; color: #fff; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, 0.5); text-underline-offset: 0.25em; }
  @media (max-width: 640px) { .erro__links { flex-direction: column; align-items: stretch; width: 100%; max-width: 32rem; } .erro__links > * { justify-content: center; } }
</style>

<main class="erro">
  <a class="erro__marca" href="/"><img width="340" height="170" alt="Instituto Brasileiro de Práticas Restaurativas, ir para a página inicial" class="erro__logo" src="/assets/images/ibpr-logo-full-navy.webp"/></a>
  <div class="citacao-cartao citacao-cartao--cta citacao-cartao--cta-404">
    <div class="citacao-cartao__miolo">
      <p class="erro__num">404</p>
      <h1 class="cta-final__title">Esta página não existe.</h1>
      <p class="cta-final__sub">O endereço pode ter mudado, ou o link que você seguiu está desatualizado.
        Comece pela página inicial ou vá direto para o que procura.</p>
      <div class="erro__links">
        <a class="btn btn--white" href="/">Ir para a página inicial</a>
        <a class="erro__btn-vidro" href="/formacoes.html">Ver as formações</a>
      </div>
      <p class="erro__mais"><a href="/ibpr-em-movimento.html">Notícias</a> · <a href="/artigos.html">Artigos</a> · <a href="/o-instituto.html">O Instituto</a></p>
    </div>
  </div>
</main>
</body>
