<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex" name="robots"/>
<title>Página não encontrada | Instituto Brasileiro de Práticas Restaurativas (IBPR)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="/assets/css/tokens.css?v=20260916a" rel="stylesheet"/>
<link href="/assets/css/components.css?v=p248" rel="stylesheet"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#0A2A4D"/>
<!-- Página que o GitHub Pages serve quando o endereço não existe.
     Sem navbar de propósito: o menu é montado pelo CMS a cada publicação, e
     acoplar esta página ao build só pra ter menu criaria uma dependência que
     não paga o que custa. Uma saída clara pra Home resolve. -->
<style>
  .erro { min-height: 100vh; display: grid; place-items: center; background: var(--color-paper); text-align: center; padding: var(--space-2xl); }
  .erro__caixa { max-width: 52rem; }
  /* 14/10/2026: logo centralizado e virando link; caminhos todos absolutos
     (/assets/...), porque o GitHub Pages serve esta página em qualquer
     endereço, inclusive com pasta (/a/b), e aí o relativo quebrava o CSS. */
  .erro__marca { display: inline-block; margin-bottom: var(--space-2xl); }
  .erro__logo { display: block; height: 5.6rem; width: auto; margin-inline: auto; }
  .erro__num { font-family: var(--font-display); font-size: 6rem; font-weight: var(--weight-semibold); color: var(--color-navy); line-height: 1; }
  .erro__titulo { font-family: var(--font-display); font-size: var(--text-h2); color: var(--color-navy); line-height: 1.15; text-wrap: balance; margin: var(--space-md) 0 var(--space-sm); }
  .erro__texto { color: var(--color-ink); font-size: var(--text-body); line-height: var(--leading-body); margin-bottom: var(--space-2xl); }
  .erro__mais { margin-top: var(--space-xl); font-size: 1.5rem; color: var(--color-mist); }
  .erro__mais a { display: inline-block; padding: 1rem 0.4rem; color: var(--color-teal); font-weight: var(--weight-semibold); }
  .erro__links { display: flex; flex-wrap: wrap; gap: var(--space-sm); justify-content: center; }
</style>
</head>
<body>
<main class="erro">
  <div class="erro__caixa">
    <a class="erro__marca" href="/"><img width="340" height="170" alt="Instituto Brasileiro de Práticas Restaurativas, ir para a página inicial" class="erro__logo" src="/assets/images/ibpr-logo-full-navy.webp"/></a>
    <p class="erro__num">404</p>
    <h1 class="erro__titulo">Esta página não existe.</h1>
    <p class="erro__texto">O endereço pode ter mudado, ou o link que você seguiu está desatualizado.
      Comece pela página inicial ou vá direto para o que procura.</p>
    <div class="erro__links">
      <a class="btn btn--dark" href="/">Ir para a página inicial</a>
      <a class="btn btn--outline" href="/formacoes.html">Ver as formações</a>
    </div>
    <p class="erro__mais"><a href="/ibpr-em-movimento.html">Notícias</a> · <a href="/artigos.html">Artigos</a> · <a href="/o-instituto.html">O Instituto</a></p>
  </div>
</main>
</body>
</html>
